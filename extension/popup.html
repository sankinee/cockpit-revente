<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cockpit Revente</title>
<link rel="stylesheet" href="style.css">
<style>
  body{width:340px;padding:16px;display:flex;flex-direction:column;gap:12px;height:auto}
  #log{font:12px/1.4 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:160px;overflow:auto;white-space:pre-wrap;display:none}
  .btn{justify-content:center}
</style>
</head>
<body>
  <div class="brand"><i>CR</i><span>Cockpit Revente</span></div>
  <button class="btn pri" id="open">Ouvrir le tableau de bord</button>
  <div class="card" style="display:flex;flex-direction:column;gap:8px">
    <h3>Synchroniser Vinted</h3>
    <p class="note" id="hint" style="margin:0">Ouvre vinted.fr (connecté à ton compte) dans l'onglet actif, puis clique ci-dessous. L'extension lit ton dressing et tes ventes, elle ne modifie rien sur Vinted.</p>
    <label class="f">ID membre (si non détecté)<input type="text" id="uid" placeholder="ex. 123456789"></label>
    <button class="btn" id="sync">Lire mon compte Vinted</button>
    <p class="note" id="status" style="margin:0"></p>
    <div id="log"></div>
    <button class="btn sm ghost" id="copyLog" style="display:none">Copier le rapport</button>
    <p class="note" id="auto" style="margin:0"></p>
  </div>
<script src="sync-merge.js"></script>
<script src="cloud.js"></script>
<script src="vinted-read.js"></script>
<script src="popup.js"></script>
</body>
</html>
